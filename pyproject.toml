[project]
name = "lg-report"
version = "0.1.0"
description = "Local LangGraph and DeepAgents execution, token, and cost reports"
readme = "README.md"
authors = [
    { name = "Martin Bechard", email = "martinbechard@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.15",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langfuse>=4,<5",
    "langgraph>=1.2.11",
    "langsmith>=0.12.6",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
lg-report = "lg_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lg_report", "samples"]
