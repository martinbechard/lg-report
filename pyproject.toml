[project]
name = "lg-report"
version = "0.1.0"
description = "Local LangGraph and DeepAgents execution, token, and cost reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Martin Bechard", email = "martinbechard@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ag-ui-langgraph>=0.0.40,<1",
    "ag-ui-protocol>=0.1,<1",
    "chromadb>=1.5.9",
    "deepagents>=0.7.15",
    "fastapi>=0.115,<1",
    "fastmcp>=4,<5",
    "huggingface-hub>=1.32.0",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain[mcp]>=1.4,<2",
    "langfuse>=4,<5",
    "langgraph>=1.2.11",
    "langsmith>=0.12.6",
    "opentelemetry-sdk>=1.44.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tokenizers>=0.23.2",
    "xlsxwriter>=3.2,<4",
]

[project.scripts]
lg-report = "reporting:main"

[project.optional-dependencies]
chat = [
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "formulas[excel]>=1.3,<2",
    "openpyxl>=3.1,<4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime", "src/reporting", "samples"]

# A source release must not traverse ignored frontend dependencies or local
# runtime state. Explicit inputs also keep compiled release archives out of
# subsequent builds; the pip bundle supplies the prebuilt browser separately.
[tool.hatch.build.targets.sdist]
include = ["/src", "/samples", "/scripts", "/data", "/docs", "/frontend/src", "/frontend/public", "/frontend/tests", "/frontend/*.json", "/frontend/*.ts", "/tests", "/README.md", "/PIP-INSTALL.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock", "/models.json", "/models.json.license", "/exchange-rate.json", "/exchange-rate.json.license", "/.env.example"]
exclude = ["**/__pycache__", "**/node_modules", "**/.cache", "**/.angular", "**/reports", "**/dist", "**/.env", "**/.env.local"]
